<link rel="preconnect" href="https://cdn.trustindex.io" />
<script async src="https://cdn.trustindex.io/loader.js"></script>
        <!-- Trustindex loader notes (Google Reviews widget).
             Loading it once here gives us:
               • window.Trustindex + window.renderTrustindexWidgets
               • a MutationObserver on <body> that auto-activates any
                 .ti-widget element inserted into the DOM (used by our
                 GoogleReviews.jsx which fetches content.html directly and
                 injects it — avoids a race across chained SPA navigations). -->
        <!-- Meta Pixel Code -->
        <script>
          !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
          n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
          document,'script','https://connect.facebook.net/en_US/fbevents.js');
          fbq('init','1913145279380964'); fbq('track','PageView');
        </script>
        <noscript><img height="1" width="1" style="display:none"
          src="https://www.facebook.com/tr?id=1913145279380964&ev=PageView&noscript=1" /></noscript>
        <!-- End Meta Pixel Code -->
        <!-- NO <title> HERE ON PURPOSE.
             Every route owns its own <title>, <meta name="description">,
             <link rel="canonical"> and og:* tags via React 19 head hoisting
             (see src/pages/Home.jsx, ServicePage.jsx, LocationPage.jsx).
             A static <title> in this shell produced a second, wrong title in
             the prerendered HTML of all 20 sub-pages. Do not re-add it. -->
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
